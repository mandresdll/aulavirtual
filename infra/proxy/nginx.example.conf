# EJEMPLO de configuración para el proxy inverso institucional (supuesto Q9: nginx).
# Termina TLS y reenvía al contenedor `web` (que a su vez reenvía /api al contenedor `api`).
# Ajustar dominio, rutas de certificados y la IP/puerto del servidor de la plataforma.

server {
    listen 80;
    server_name cursos.example.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cursos.example.cl;

    ssl_certificate     /etc/ssl/certs/cursos.example.cl.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/cursos.example.cl.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
