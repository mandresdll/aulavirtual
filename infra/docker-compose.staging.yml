# Staging (ambiente de pruebas de la UTA). ESQUELETO: se completa en la Fase 8
# (imágenes del registro, respaldos, límites de recursos y logs).
# Pasarela en modo integración y Aula Virtual de pruebas; adaptadores simulados permitidos.
services:
  api:
    environment:
      APP_ENV: staging
      # Staging nunca se indexa: contenido de prueba.
      SEO_ALLOW_INDEXING: 'false'
    ports:
      - '127.0.0.1:3000:3000' # el proxy institucional apunta aquí

  worker:
    environment:
      APP_ENV: staging

  web:
    ports:
      - '127.0.0.1:8080:8080'
