# Staging (ambiente de pruebas de la UTA): pasarela en modo integración y Aula Virtual de pruebas.
# Se permiten adaptadores simulados. Ver docs/despliegue.md.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  postgres:
    <<: *logging
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    <<: *logging
    deploy:
      resources:
        limits:
          memory: 256m

  migrate:
    <<: *logging
    environment:
      APP_ENV: staging

  api:
    <<: *logging
    environment:
      APP_ENV: staging
      # Staging nunca se indexa: contenido de prueba.
      SEO_ALLOW_INDEXING: 'false'
    ports:
      - '127.0.0.1:3000:3000' # el proxy institucional apunta aquí
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    <<: *logging
    environment:
      APP_ENV: staging
    deploy:
      resources:
        limits:
          memory: 256m

  web:
    <<: *logging
    ports:
      - '127.0.0.1:8080:8080'
    deploy:
      resources:
        limits:
          memory: 128m
