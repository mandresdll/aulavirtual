# Servidor de la SPA dentro del contenedor `web`. El TLS lo termina el proxy inverso
# institucional (ver infra/proxy/ y docs/despliegue.md).

upstream api_upstream {
    server api:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    # SEO (RF-02): el index.html incluye `<!--# include virtual="/__seo_head" -->`. nginx lo
    # resuelve pidiendo a la API las etiquetas de la página original ($request_uri se conserva
    # en las subpeticiones). Si la API falla, se usan las etiquetas por defecto del bloque
    # `seo_default` del propio index.html.
    location = /__seo_head {
        internal;
        proxy_pass http://api_upstream/api/seo/head;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Accept-Encoding "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        # Un error de la API (429, 5xx…) no debe terminar dentro del <head>: respuesta vacía,
        # y el SSI usa el bloque `seo_default`.
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @seo_head_fallback;
    }

    location @seo_head_fallback {
        return 204;
    }

    location = /sitemap.xml {
        proxy_pass http://api_upstream/api/seo/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://api_upstream/api/seo/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash en el nombre: caché inmutable de un año.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Rutas de la SPA: index.html sin caché para publicar versiones nuevas al instante.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        ssi on;
        try_files $uri /index.html;
    }
}
