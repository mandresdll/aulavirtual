name: Load test

# Prueba de carga con k6 contra el stack en contenedores. Se lanza a mano o cuando cambia la prueba:
# tarda varios minutos y no aporta en cada PR. Ver docs/rendimiento.md.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tests/load/**
      - .github/workflows/load.yml

permissions:
  contents: read

jobs:
  k6:
    name: k6 (300 usuarios)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment (mock adapters)
        # Todo el tráfico sale de una sola IP: se suben los límites por IP para medir la plataforma
        # y no el rate limit.
        run: |
          cp .env.example .env
          sed -i -E 's/^(RATE_LIMIT_MAX|VERIFY_RATE_LIMIT_MAX|PAGE_VIEW_RATE_LIMIT_MAX)=.*/\1=100000000/' .env
      - name: Build images and start the stack
        run: |
          docker compose up --build --detach
          timeout 240 bash -c 'until curl -fsS http://localhost:8080/api/ready; do sleep 3; done'
      - name: Run k6
        run: |
          docker run --rm --network host --user "$(id -u)" -v "$PWD:/work" -w /work \
            -e BASE_URL=http://localhost:8080 grafana/k6:0.57.0 run tests/load/public.js
      - name: Publish the result
        if: always()
        run: |
          if [ -f load-summary.json ]; then
            echo "::notice title=k6::$(cat load-summary.json)"
            cat load-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 api web
